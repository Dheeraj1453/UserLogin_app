{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password</title>
  
  <!-- Linking to the separate CSS file -->
  <link rel="stylesheet" href="{% static 'styles.css' %}">
</head>
<body>

  <div class="card-container">
    <div class="logo-wrapper">
      <img src="{% static 'attachment_121844903.jpg' %}" alt="Logo" class="logo-img">
    </div>

    <h1 class="card-title">Forgot Password</h1>
    <p class="card-subtitle">Enter your username to reset your password</p>

    <!-- Error Message -->
    {% if error %}
      <div class="error-message">
        {{ error }}
      </div>
    {% endif %}

    <!-- Success Message -->
    {% if success %}
      <div class="success-message">
        {{ success }}
      </div>
    {% endif %}

    <form action="" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="username" class="form-label">Username</label>
        <input 
          type="text" 
          id="username" 
          name="username" 
          class="form-input" 
          placeholder="Enter your username" 
          required
        >
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 10px;">
        Reset Password
      </button>
    </form>

    <div class="card-footer">
      Remember your password? 
      <!-- Ensure 'login' matches the name of your login path in urls.py -->
      <a href="{% url 'login' %}">Log In</a>
    </div>
  </div>

</body>
</html>
