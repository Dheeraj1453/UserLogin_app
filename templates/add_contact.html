{% extends 'base.html' %}

{% block title %}Add Contact{% endblock %}
{% block nav_add %}active{% endblock %}

{% block content %}
<div class="form-wrapper-center">
  <div class="card-container">
    <h1 class="card-title">New Contact</h1>
    <p class="card-subtitle">Enter details to add a new contact</p>

    <form action="" method="POST" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label for="image" class="form-label">Profile Image</label>
        <input type="file" id="image" name="image" class="form-input" accept="image/*">
      </div>

      <div class="form-group">
        <label for="name" class="form-label">Full Name</label>
        <input type="text" id="name" name="name" class="form-input" placeholder="e.g. Dheeraj Kumar Jha" required>
      </div>

      <div class="form-group">
        <label for="contact_number" class="form-label">Contact Number</label>
        <input type="tel" id="contact_number" name="contact_number" class="form-input" placeholder="+91 9876543210" required>
      </div>

      <div class="form-group">
        <label for="relation" class="form-label">Relation</label>
        <select id="relation" name="relation" class="form-select" required>
          <option value="" disabled selected>Select relation</option>
          <option value="Family">Family</option>
          <option value="Friend">Friend</option>
          <option value="Work">Work</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 10px;">
        Save Contact
      </button>
    </form>
  </div>
</div>
{% endblock %}
