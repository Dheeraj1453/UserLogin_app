{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password</title>
  
  <!-- Linking to your existing separate CSS file -->
  <!-- Using ?v=1.1 just in case you update your CSS again to prevent cache issues -->
  <link rel="stylesheet" href="{% static 'styles.css' %}?v=1.1">
</head>
<body>

  <div class="card-container">
    <div class="logo-wrapper">
      <img src="{% static 'attachment_121844903.jpg' %}" alt="Logo" class="logo-img">
    </div>

    <h1 class="card-title">Reset Password</h1>
    <p class="card-subtitle">Secure your account with a new password</p>

    <!-- Error Message -->
    {% if error %}
      <div class="error-message">
        {{ error }}
      </div>
    {% endif %}

    <form action="" method="POST">
      {% csrf_token %}

      <div class="form-group">
        <label for="password" class="form-label">New Password</label>
        <input 
          type="password" 
          id="password" 
          name="password" 
          class="form-input" 
          placeholder="••••••••" 
          required
        >
      </div>

      <div class="form-group">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input 
          type="password" 
          id="confirm_password" 
          name="confirm_password" 
          class="form-input" 
          placeholder="••••••••" 
          required
        >
      </div>

      <button type="submit" class="btn-primary" style="margin-top: 10px;">
        Update Password
      </button>
    </form>

    <div class="card-footer">
      Remembered your password? 
      <!-- Ensure 'login' matches the name of your login path in urls.py -->
      <a href="{% url 'login' %}">Log In</a>
    </div>
  </div>

</body>
</html>
